apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentguard-openclaw-mcp
  labels:
    app.kubernetes.io/name: agentguard-openclaw-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentguard-openclaw-mcp
  # Deliberately pinned for the HMAC + emptyDir pre-production baseline.
  # Raise both values only after switching to shared OpenBao/external state.
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
