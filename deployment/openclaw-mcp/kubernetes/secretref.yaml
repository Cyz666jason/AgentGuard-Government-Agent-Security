# External Secrets Operator example.  This resource does not contain a
# credential; it maps keys from the organization's secret manager into a
# namespaced Secret consumed by deployment.yaml.  If ESO is not approved,
# provision the same Secret out-of-band and keep this file unapplied.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentguard-openclaw-mcp-secrets
  labels:
    app.kubernetes.io/name: agentguard-openclaw-mcp
    app.kubernetes.io/component: remote-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: organization-secret-store
    kind: ClusterSecretStore
  target:
    name: agentguard-openclaw-mcp-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ticket-secret
      remoteRef:
        key: agentguard/remote-mcp/ticket-secret
    # The TLS secret referenced by ingress.yaml is managed by the ingress
    # certificate controller, not by this application Secret.
