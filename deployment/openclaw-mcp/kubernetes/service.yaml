apiVersion: v1
kind: Service
metadata:
  name: agentguard-openclaw-mcp
  labels:
    app.kubernetes.io/name: agentguard-openclaw-mcp
    app.kubernetes.io/component: remote-mcp
  annotations:
    # Keep the service internal.  The Ingress is the only reviewed edge path.
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentguard-openclaw-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
