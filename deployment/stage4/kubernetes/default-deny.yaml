# Apply only after the target CNI is proven to enforce NetworkPolicy and the
# emergency access/runbook is approved.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentguard-default-deny
  namespace: agentguard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentguard-allow-dns
  namespace: agentguard
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
